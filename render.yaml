services:
  - type: web
    name: prd-studio-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build -w @prd-studio/contracts && npm run build -w @prd-studio/server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-flash-latest
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 5001
